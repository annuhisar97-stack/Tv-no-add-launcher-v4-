name: Auto Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Arrange and Fix Project Configuration
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values

          # Move app build gradle
          if [ -f "build.gradle (1).kts" ]; then
            mv "build.gradle (1).kts" app/build.gradle.kts
          fi

          # Move AndroidManifest
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # Move Kotlin source code
          if [ -f "MainActivity.kt" ]; then
            mv MainActivity.kt app/src/main/java/
          fi
          if [ -f "BootReceiver.kt" ]; then
            mv BootReceiver.kt app/src/main/java/
          fi

          # Move XML resources
          if [ -f "strings.xml" ]; then
            mv strings.xml app/src/main/res/values/strings.xml
          fi
          if [ -f "styles.xml" ]; then
            mv styles.xml app/src/main/res/values/styles.xml
          fi

          # Java aur Kotlin dono ko Version 17 par match karein
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle.kts || true
          sed -i 's/"1.8"/"17"/g' app/build.gradle.kts || true
          sed -i "s/'1.8'/'17'/g" app/build.gradle.kts || true

          cat << 'EOF' >> app/build.gradle.kts

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          # Global gradle properties setting
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=ignore" >> ~/.gradle/gradle.properties
          echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoAds-TV-Launcher-APK
          path: "app/build/outputs/apk/debug/*.apk"
